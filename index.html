
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Licenciado | iGreen Energia Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#06231A;
    --deep-2:#0B3D24;
    --green:#159A52;
    --green-light:#2BC474;
    --neon:#5CFF9E;
    --mint-50:#EFFBF3;
    --paper:#FFFFFF;
    --ink:#0B1710;
    --mist:#5B6E64;
    --line:rgba(11,23,16,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3,.font-display{font-family:'Manrope',sans-serif;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{display:block;max-width:100%;}
  .container{max-width:1180px;margin:0 auto;padding:0 6vw;}
  .center{text-align:center;}
  input,select{font-family:'Inter',sans-serif;}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.16,.8,.24,1), transform .9s cubic-bezier(.16,.8,.24,1);}
  .reveal.in{opacity:1;transform:translateY(0);}
  .reveal-left{opacity:0;transform:translateX(-40px);transition:opacity 1.1s cubic-bezier(.16,.8,.24,1), transform 1.1s cubic-bezier(.16,.8,.24,1);}
  .reveal-left.in{opacity:1;transform:translateX(0);}
  .reveal-right{opacity:0;transform:translateX(40px);transition:opacity 1.1s cubic-bezier(.16,.8,.24,1), transform 1.1s cubic-bezier(.16,.8,.24,1);}
  .reveal-right.in{opacity:1;transform:translateX(0);}
  .stagger .reveal:nth-child(1){transition-delay:.05s;}
  .stagger .reveal:nth-child(2){transition-delay:.15s;}
  .stagger .reveal:nth-child(3){transition-delay:.25s;}
  .stagger .reveal:nth-child(4){transition-delay:.35s;}

  /* ---------- NAV ---------- */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:var(--deep);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:radial-gradient(circle at 35% 30%, #8FE39A, #159A52 70%);box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  .logo-text{line-height:1.1;}
  .logo-text b{display:block;font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;color:#fff;}
  .logo-text span{font-size:9px;letter-spacing:.09em;color:rgba(255,255,255,.55);text-transform:uppercase;}
  .nav-links{display:flex;align-items:center;gap:32px;font-size:14px;font-weight:500;color:rgba(255,255,255,.75);}
  .nav-links a{transition:color .3s ease;}
  .nav-links a:hover{color:var(--neon);}
  @media (max-width:860px){.nav-links{display:none;}}
  .btn-nav{background:var(--green);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
    transition:transform .3s ease, background .3s ease;}
  .btn-nav:hover{transform:translateY(-2px);background:var(--green-light);}

  /* ---------- HERO ---------- */
  .hero{background:linear-gradient(160deg,var(--deep) 0%, var(--deep-2) 100%);padding:130px 0 70px;position:relative;overflow:hidden;color:#fff;}
  .hero::before{content:'';position:absolute;top:-30%;right:-10%;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle, rgba(92,255,158,.14), transparent 70%);filter:blur(10px);}
  .hero-grid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center;}
  @media (max-width:960px){.hero-grid{grid-template-columns:1fr;}}
  h1.hero-title{font-size:clamp(30px,4vw,44px);font-weight:800;line-height:1.18;letter-spacing:-0.02em;}
  h1.hero-title .accent{color:var(--neon);}
  .hero-sub{margin-top:18px;font-size:16px;color:rgba(255,255,255,.68);max-width:460px;line-height:1.65;}
  .hero-sub b{color:#fff;}
  .trust-row{margin-top:30px;display:flex;flex-wrap:wrap;gap:22px;}
  .trust-item{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8);}
  .trust-icon{width:30px;height:30px;border-radius:50%;background:rgba(92,255,158,.12);border:1px solid rgba(92,255,158,.3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .hero-cta{margin-top:32px;}
  .btn-hero{background:var(--green);color:#fff;padding:17px 28px;border-radius:100px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:10px;
    box-shadow:0 12px 28px -8px rgba(21,154,82,.55);transition:transform .35s cubic-bezier(.16,.8,.24,1), box-shadow .35s ease, background .35s ease;}
  .btn-hero:hover{transform:translateY(-3px) scale(1.02);background:var(--green-light);box-shadow:0 16px 34px -8px rgba(21,154,82,.6), 0 0 24px rgba(92,255,158,.3);}
  .hero-caption{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.5);}
  .hero-caption b{color:rgba(255,255,255,.75);}

  .hero-frame{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
    animation:floaty 6s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  .hero-frame img{width:100%;aspect-ratio:4/3.3;object-fit:cover;transform:scale(1.05);animation:slowzoom 15s ease-in-out infinite alternate;}
  @keyframes slowzoom{0%{transform:scale(1.05);}100%{transform:scale(1.13);}}
  .hero-frame::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,35,26,0) 50%, rgba(6,35,26,.5) 100%);}

  /* ---------- SOLUÇÕES ---------- */
  .section{padding:100px 0;}
  .section-head{max-width:600px;margin:0 auto 56px;text-align:center;}
  .section-head h2{font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-0.02em;}
  .section-head h2 .g{color:var(--green);}
  .section-head p{margin-top:14px;color:var(--mist);font-size:16px;}

  .plans-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  @media (max-width:860px){.plans-grid{grid-template-columns:1fr;}}
  .plan-card{border-radius:24px;overflow:hidden;border:1px solid var(--line);
    transition:transform .4s cubic-bezier(.16,.8,.24,1), box-shadow .4s ease;}
  .plan-card:hover{transform:translateY(-8px);box-shadow:0 26px 50px -20px rgba(11,23,16,.18);}
  .plan-photo{position:relative;height:210px;}
  .plan-photo img{width:100%;height:100%;object-fit:cover;}
  .plan-tag{position:absolute;top:16px;left:16px;background:rgba(6,35,26,.75);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;border-radius:100px;}
  .plan-body{padding:28px;}
  .plan-title{display:flex;align-items:center;gap:8px;font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;}
  .plan-desc{margin-top:8px;font-size:14px;color:var(--mist);line-height:1.6;}
  .plan-pct-box{margin-top:20px;background:var(--mint-50);border-radius:14px;padding:16px 18px;}
  .plan-pct-box .lbl{font-size:12px;color:var(--mist);}
  .plan-pct-box .val{font-family:'Manrope',sans-serif;font-weight:800;font-size:30px;color:var(--deep-2);}
  .plan-list{margin-top:20px;display:flex;flex-direction:column;gap:11px;}
  .plan-list li{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(11,23,16,.78);}
  .plan-list li .ck{color:var(--green);font-weight:700;}
  .plan-btn{margin-top:24px;width:100%;text-align:center;padding:15px;border-radius:100px;font-weight:700;font-size:14.5px;
    transition:transform .3s ease, opacity .3s ease;display:block;}
  .plan-btn:hover{transform:translateY(-2px);opacity:.92;}
  .plan-btn.g{background:var(--green);color:#fff;}
  .plan-btn.d{background:var(--deep);color:#fff;}

  /* ---------- WHY BAND ---------- */
  .why-band{background:var(--deep);color:#fff;border-radius:28px;padding:50px 40px;margin:0 6vw;}
  .why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;}
  @media (max-width:860px){.why-grid{grid-template-columns:repeat(2,1fr);}}
  .why-item{text-align:center;}
  .why-icon{width:52px;height:52px;border-radius:50%;background:rgba(92,255,158,.1);border:1px solid rgba(92,255,158,.3);
    display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px;}
  .why-item h3{font-size:15px;font-weight:700;margin-bottom:6px;}
  .why-item p{font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.5;}

  /* ---------- FORM SECTION ---------- */
  .form-section{padding:100px 0;}
  .form-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:60px;align-items:center;}
  @media (max-width:900px){.form-grid{grid-template-columns:1fr;}}
  .form-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 16px;border-radius:100px;background:var(--mint-50);color:var(--green);margin-bottom:18px;}
  .form-title{font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
  .form-title .g{color:var(--green);}
  .form-desc{margin-top:16px;color:var(--mist);font-size:15.5px;line-height:1.7;max-width:440px;}
  .form-note{margin-top:24px;background:var(--mint-50);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--deep-2);}
  .form-note .ico{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .form-card{background:#fff;border-radius:26px;padding:36px;box-shadow:0 26px 60px -22px rgba(11,23,16,.18);border:1px solid var(--line);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:520px){.form-row{grid-template-columns:1fr;}}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:7px;display:block;}
  .field input, .field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#F9FBFA;font-size:14px;color:var(--ink);outline:none;transition:border-color .25s ease, box-shadow .25s ease;}
  .field input:focus, .field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(21,154,82,.12);}
  .form-submit{width:100%;margin-top:8px;background:var(--green);color:#fff;padding:16px;border:none;border-radius:100px;font-weight:700;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .3s cubic-bezier(.16,.8,.24,1), box-shadow .3s ease, background .3s ease;}
  .form-submit:hover{transform:translateY(-2px) scale(1.01);background:var(--green-light);box-shadow:0 14px 30px -10px rgba(21,154,82,.5);}
  .form-privacy{text-align:center;font-size:11.5px;color:var(--mist);margin-top:14px;}

  /* ---------- ESPECIALISTA ---------- */
  .specialist-section{padding:100px 0;background:linear-gradient(180deg,#fff 0%, var(--mint-50) 100%);}
  .spec-grid{display:grid;grid-template-columns:0.85fr 1.15fr;gap:60px;align-items:center;}
  @media (max-width:900px){.spec-grid{grid-template-columns:1fr;}}
  .spec-photo-wrap{position:relative;}
  .spec-glow{position:absolute;inset:-14px;border-radius:32px;background:linear-gradient(135deg, rgba(92,255,158,.35), rgba(11,61,36,.15));filter:blur(20px);opacity:.6;z-index:0;}
  .spec-photo{position:relative;z-index:1;border-radius:24px;overflow:hidden;box-shadow:0 26px 60px -20px rgba(6,35,26,.4);}
  .spec-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;}
  .spec-badge{position:absolute;z-index:2;bottom:18px;left:18px;background:rgba(6,35,26,.7);backdrop-filter:blur(10px);color:#fff;padding:10px 16px;border-radius:100px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .spec-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--neon);}

  /* ---------- TIMELINE (como funciona) ---------- */
  .steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative;}
  @media (max-width:860px){.steps-row{grid-template-columns:repeat(2,1fr);}}
  .step-item{text-align:center;position:relative;}
  .step-circle{width:64px;height:64px;border-radius:50%;background:#fff;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;
    box-shadow:0 10px 24px -12px rgba(11,23,16,.14);transition:transform .35s ease, border-color .35s ease;}
  .step-item:hover .step-circle{transform:translateY(-4px);border-color:var(--green);}
  .step-item p{font-size:13.5px;color:var(--mist);line-height:1.5;max-width:180px;margin:0 auto;}
  .step-item b{color:var(--ink);}

  /* ---------- TESTIMONIALS ---------- */
  .test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:860px){.test-grid{grid-template-columns:1fr;}}
  .test-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;
    transition:transform .4s ease, box-shadow .4s ease;}
  .test-card:hover{transform:translateY(-6px);box-shadow:0 22px 44px -18px rgba(11,23,16,.14);}
  .test-quote{font-size:26px;color:var(--green);line-height:1;margin-bottom:10px;}
  .test-card p{font-size:14.5px;color:rgba(11,23,16,.78);line-height:1.65;}
  .test-who{margin-top:18px;display:flex;align-items:center;gap:10px;}
  .test-avatar{width:38px;height:38px;border-radius:50%;background:var(--mint-50);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green);font-size:13px;}
  .test-who .name{font-size:13.5px;font-weight:700;}
  .test-who .role{font-size:12px;color:var(--mist);}

  /* ---------- FOOTER ---------- */
  footer{background:var(--deep);color:rgba(255,255,255,.6);padding:60px 0 30px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;}
  @media (max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}
  .footer-brand{display:flex;align-items:center;gap:10px;}
  .footer-desc{margin-top:14px;font-size:13px;max-width:240px;line-height:1.6;}
  .footer-col h4{font-size:13px;color:#fff;font-weight:700;margin-bottom:16px;}
  .footer-col a{display:block;font-size:13px;margin-bottom:10px;transition:color .3s ease;}
  .footer-col a:hover{color:var(--neon);}
  .footer-bottom{margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.35);text-align:center;}

  /* ---------- FLOATING WA ---------- */
  .wa-float{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;align-items:center;gap:10px;
    background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:16px 22px;border-radius:100px;
    box-shadow:0 14px 34px rgba(21,154,82,.45);transition:transform .4s cubic-bezier(.16,.8,.24,1);}
  .wa-float:hover{transform:translateY(-4px) scale(1.05);}
  .pulse-ring{position:relative;width:9px;height:9px;border-radius:50%;background:var(--neon);flex-shrink:0;}
  .pulse-ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--neon);animation:pulseRing 2s ease-out infinite;}
  @keyframes pulseRing{0%{transform:scale(.6);opacity:1;}100%{transform:scale(2.1);opacity:0;}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }

  /* ---------- CLUB SECTION ---------- */
  .club-section{padding:100px 0;background:var(--deep);color:#fff;position:relative;overflow:hidden;}
  .club-section::before{content:'';position:absolute;top:-20%;left:-10%;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(92,255,158,.14), transparent 70%);filter:blur(10px);}
  .club-grid{position:relative;display:grid;grid-template-columns:1fr 0.8fr;gap:60px;align-items:center;}
  @media (max-width:900px){.club-grid{grid-template-columns:1fr;}}
  .club-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 16px;border-radius:100px;background:rgba(92,255,158,.12);border:1px solid rgba(92,255,158,.3);color:var(--neon);margin-bottom:20px;}
  .club-title{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
  .club-title .g{color:var(--neon);}
  .club-desc{margin-top:16px;color:rgba(255,255,255,.68);font-size:16px;line-height:1.75;max-width:480px;}
  .club-highlight{margin-top:22px;display:flex;align-items:center;gap:14px;background:rgba(92,255,158,.08);border:1px solid rgba(92,255,158,.25);
    border-radius:16px;padding:18px 20px;}
  .club-highlight .ico{width:38px;height:38px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
  .club-highlight p{font-size:13.5px;color:rgba(255,255,255,.85);line-height:1.55;}
  .club-highlight b{color:var(--neon);}
  .club-tags{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;}
  .club-tag{font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);}

  .club-phone-wrap{position:relative;display:flex;justify-content:center;}
  .club-phone{position:relative;width:260px;border-radius:32px;overflow:hidden;border:6px solid #0A0A0A;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:floaty 6s ease-in-out infinite;}
  .club-phone img,.club-phone video{width:100%;display:block;}
  .club-phone-glow{position:absolute;inset:-20px;border-radius:44px;background:radial-gradient(circle, rgba(92,255,158,.3), transparent 70%);filter:blur(24px);z-index:-1;}

  /* ---------- top discounts mini list ---------- */
  .club-discounts{margin-top:28px;}
  .club-discounts-title{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:14px;}
  .discount-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);}
  .discount-row:last-child{border-bottom:none;}
  .discount-icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .discount-info{flex:1;}
  .discount-name{font-size:13.5px;font-weight:600;color:#fff;}
  .discount-cat{font-size:11.5px;color:rgba(255,255,255,.5);}
  .discount-off{font-size:12.5px;font-weight:700;color:var(--neon);white-space:nowrap;}

</style>
</head>
<body>
